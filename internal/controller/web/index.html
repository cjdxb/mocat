<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mocat 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card login-card">
    <h1>mocat 控制台</h1>
    <label>用户名<input name="username" autocomplete="username" value="admin" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="login-err"></div>
    <button class="btn primary" type="submit">登录</button>
  </form>
</div>
<div id="app" class="hidden">
  <header class="top">
    <div class="brand">mocat</div>
    <nav id="nav">
      <a href="#/" data-nav="overview">总览</a>
      <a href="#/nodes" data-nav="nodes">节点</a>
      <a href="#/rules" data-nav="rules">规则</a>
      <a href="#/chains" data-nav="chains">转发链</a>
      <a href="#/templates" data-nav="templates">伪装模板</a>
      <a href="#/audit" data-nav="audit">审计日志</a>
      <a href="#/settings" data-nav="settings">账号</a>
    </nav>
    <div class="user"><span id="user-name"></span> <button class="btn small" data-action="logout">退出</button></div>
  </header>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div id="modal-body"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
